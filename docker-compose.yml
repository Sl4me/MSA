version: '3.8'

services:
  # Контейнер с базой данных
  db:
    image: mysql:8.0
    container_name: forum-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forum
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Контейнер с нашим Spring Boot приложением
  app:
    build: .
    container_name: forum-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Указываем Spring, что база данных находится по адресу db:3306 (имя сервиса)
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/forum?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: